name: islami
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.7
  introduction_screen: ^4.0.0
  simple_gradient_text: 1.4.0
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/images/on_boarding/


  fonts:
    - family: Kamail
      fonts:
        - asset: assets/fonts/kamali/Kamali.otf
          weight: 400

    - family: Janna
      fonts:
        - asset: assets/fonts/janna_lt/Janna-LT-Bold.ttf
          weight: 700